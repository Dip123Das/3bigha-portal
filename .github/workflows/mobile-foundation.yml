name: Mobile foundation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/verify-mob-01-foundation.mjs"
      - "scripts/verify-mob-02-contract-layer.mjs"
      - "scripts/verify-mob-03-native-auth.mjs"
      - "scripts/verify-mob-04-native-onboarding.mjs"
      - "scripts/verify-mob-05-native-dashboards.mjs"
      - "scripts/verify-mob-06-dashboard-aggregates.mjs"
      - "scripts/verify-mob-07-push-device-lifecycle.mjs"
      - "scripts/verify-mob-08-offline-device-mutations.mjs"
      - "scripts/verify-mob-09-notification-routing.mjs"
      - "scripts/verify-mob-10-production-build-readiness.mjs"
      - "scripts/verify-mob-11-release-health.mjs"
      - "scripts/verify-mob-12-accessibility.mjs"
      - "scripts/verify-mob-13-failure-containment.mjs"
      - "scripts/verify-mob-14-network-resilience.mjs"
      - "scripts/verify-mob-15-auth-deep-link-integrity.mjs"
      - "scripts/verify-mob-16-background-privacy.mjs"
      - "scripts/verify-mob-17-foreground-session.mjs"
      - "scripts/verify-mob-18-device-reauthentication.mjs"
      - "scripts/verify-mob-19-screen-capture-protection.mjs"
      - ".github/workflows/mobile-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "scripts/verify-mob-01-foundation.mjs"
      - "scripts/verify-mob-02-contract-layer.mjs"
      - "scripts/verify-mob-03-native-auth.mjs"
      - "scripts/verify-mob-04-native-onboarding.mjs"
      - "scripts/verify-mob-05-native-dashboards.mjs"
      - "scripts/verify-mob-06-dashboard-aggregates.mjs"
      - "scripts/verify-mob-07-push-device-lifecycle.mjs"
      - "scripts/verify-mob-08-offline-device-mutations.mjs"
      - "scripts/verify-mob-09-notification-routing.mjs"
      - "scripts/verify-mob-10-production-build-readiness.mjs"
      - "scripts/verify-mob-11-release-health.mjs"
      - "scripts/verify-mob-12-accessibility.mjs"
      - "scripts/verify-mob-13-failure-containment.mjs"
      - "scripts/verify-mob-14-network-resilience.mjs"
      - "scripts/verify-mob-15-auth-deep-link-integrity.mjs"
      - "scripts/verify-mob-16-background-privacy.mjs"
      - "scripts/verify-mob-17-foreground-session.mjs"
      - "scripts/verify-mob-18-device-reauthentication.mjs"
      - "scripts/verify-mob-19-screen-capture-protection.mjs"
      - ".github/workflows/mobile-foundation.yml"

permissions:
  contents: read

jobs:
  verify-native-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run bundle:android
      - run: npm run bundle:ios
      - name: Verify canonical native boundary
        working-directory: .
        run: |
          node scripts/verify-mob-01-foundation.mjs
          node scripts/verify-mob-02-contract-layer.mjs
          node scripts/verify-mob-03-native-auth.mjs
          node scripts/verify-mob-04-native-onboarding.mjs
          node scripts/verify-mob-05-native-dashboards.mjs
          node scripts/verify-mob-06-dashboard-aggregates.mjs
          node scripts/verify-mob-07-push-device-lifecycle.mjs
          node scripts/verify-mob-08-offline-device-mutations.mjs
          node scripts/verify-mob-09-notification-routing.mjs
          node scripts/verify-mob-10-production-build-readiness.mjs
          node scripts/verify-mob-11-release-health.mjs
          node scripts/verify-mob-12-accessibility.mjs
          node scripts/verify-mob-13-failure-containment.mjs
          node scripts/verify-mob-14-network-resilience.mjs
          node scripts/verify-mob-15-auth-deep-link-integrity.mjs
          node scripts/verify-mob-16-background-privacy.mjs
          node scripts/verify-mob-17-foreground-session.mjs
          node scripts/verify-mob-18-device-reauthentication.mjs
          node scripts/verify-mob-19-screen-capture-protection.mjs
