name: Mobile foundation

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/verify-mob-01-foundation.mjs"
      - "scripts/verify-mob-02-contract-layer.mjs"
      - "scripts/verify-mob-03-native-auth.mjs"
      - "scripts/verify-mob-04-native-onboarding.mjs"
      - "scripts/verify-mob-05-native-dashboards.mjs"
      - "scripts/verify-mob-06-dashboard-aggregates.mjs"
      - "scripts/verify-mob-07-push-device-lifecycle.mjs"
      - ".github/workflows/mobile-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "scripts/verify-mob-01-foundation.mjs"
      - "scripts/verify-mob-02-contract-layer.mjs"
      - "scripts/verify-mob-03-native-auth.mjs"
      - "scripts/verify-mob-04-native-onboarding.mjs"
      - "scripts/verify-mob-05-native-dashboards.mjs"
      - "scripts/verify-mob-06-dashboard-aggregates.mjs"
      - "scripts/verify-mob-07-push-device-lifecycle.mjs"
      - ".github/workflows/mobile-foundation.yml"

permissions:
  contents: read

jobs:
  verify-native-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run bundle:android
      - run: npm run bundle:ios
      - name: Verify canonical native boundary
        working-directory: .
        run: |
          node scripts/verify-mob-01-foundation.mjs
          node scripts/verify-mob-02-contract-layer.mjs
          node scripts/verify-mob-03-native-auth.mjs
          node scripts/verify-mob-04-native-onboarding.mjs
          node scripts/verify-mob-05-native-dashboards.mjs
          node scripts/verify-mob-06-dashboard-aggregates.mjs
          node scripts/verify-mob-07-push-device-lifecycle.mjs
